<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="340" fill="#0d1117" rx="10"/>
  <text x="30" y="36" fill="#c9d1d9" font-size="16" font-weight="bold">Week of Sep 15-21, 2026</text>
  <text x="30" y="56" fill="#5c6370" font-size="12">five stories, one pattern: trusted things behaving badly</text>

  <!-- card 1 -->
  <rect x="30" y="80" width="255" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="106" fill="#e5484d" font-size="22" font-weight="bold">10.0</text>
  <text x="48" y="126" fill="#c9d1d9" font-size="12">Cisco ISE auth bypass</text>
  <text x="48" y="144" fill="#8b93a7" font-size="11">CVE-2026-76460</text>
  <text x="48" y="162" fill="#8b93a7" font-size="11">actively exploited</text>

  <!-- card 2 -->
  <rect x="310" y="80" width="255" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="328" y="106" fill="#e5484d" font-size="22" font-weight="bold">4</text>
  <text x="328" y="126" fill="#c9d1d9" font-size="12">AI coding agents hit</text>
  <text x="328" y="144" fill="#8b93a7" font-size="11">Plugin4Shell, zero-click</text>
  <text x="328" y="162" fill="#8b93a7" font-size="11">2 patched, 2 not</text>

  <!-- card 3 -->
  <rect x="590" y="80" width="255" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="608" y="106" fill="#e5484d" font-size="22" font-weight="bold">100K+</text>
  <text x="608" y="126" fill="#c9d1d9" font-size="12">sites hit by ClickFix</text>
  <text x="608" y="144" fill="#8b93a7" font-size="11">Brevo supply-chain attack</text>
  <text x="608" y="162" fill="#8b93a7" font-size="11">3 separate campaigns this week</text>

  <!-- card 4 -->
  <rect x="30" y="205" width="255" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="231" fill="#e5484d" font-size="22" font-weight="bold">111</text>
  <text x="48" y="251" fill="#c9d1d9" font-size="12">days Shai-Hulud slept</text>
  <text x="48" y="269" fill="#8b93a7" font-size="11">before resurfacing in 4</text>
  <text x="48" y="287" fill="#8b93a7" font-size="11">new npm packages</text>

  <!-- card 5 -->
  <rect x="310" y="205" width="255" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="328" y="231" fill="#e5484d" font-size="22" font-weight="bold">1.79</text>
  <text x="328" y="251" fill="#c9d1d9" font-size="12">avg fixed findings</text>
  <text x="328" y="269" fill="#8b93a7" font-size="11">per project, Glasswing</text>
  <text x="328" y="287" fill="#8b93a7" font-size="11">ledger, 5 months in</text>

  <!-- card 6 -->
  <rect x="590" y="205" width="255" height="110" rx="6" fill="#0f1a2e" stroke="#3b6ea5"/>
  <text x="608" y="231" fill="#79c0ff" font-size="22" font-weight="bold">3</text>
  <text x="608" y="251" fill="#c9d1d9" font-size="12">things to do today</text>
  <text x="608" y="269" fill="#8b93a7" font-size="11">patch ISE, update your</text>
  <text x="608" y="287" fill="#8b93a7" font-size="11">coding agent, check npm deps</text>
</svg>
