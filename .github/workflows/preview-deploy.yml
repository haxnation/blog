# ═══════════════════════════════════════════════════════════════════════════════
# preview-deploy.yml — PR Preview STAGE 2/2: Deploy (TRUSTED)
# ═══════════════════════════════════════════════════════════════════════════════
#
# SECURITY MODEL:
#   - Triggered via `workflow_run` by completion of STAGE 1. This workflow
#     itself runs TRUSTED code from `main` — it NEVER checks out PR code.
#   - It downloads the static artifact built in STAGE 1 and pushes ONLY the
#     `pr-<N>/` subfolder of the `gh-pages` branch. Production files at the
#     branch root are never touched here.
#   - Author authorization is re-checked here against blog-writers.txt from
#     `main` (not from the PR). Unauthorized authors get no preview deployment
#     (fail-safe against spam / mining abuse).
#   - PR number is strictly validated as digits to prevent path traversal.
#
# REQUIRES (one-time, see deploy.yml header):
#   - Pages Source: "Deploy from a branch" → gh-pages / root
#   - Actions → General → Workflow permissions: Read repository contents
#     (per-job `contents: write` below escalates only this workflow).
#
# ═══════════════════════════════════════════════════════════════════════════════

name: PR Preview — Deploy (trusted)

on:
  workflow_run:
    workflows: [ 'PR Preview — Build (untrusted)' ]
    types: [ completed ]

permissions:
  contents: write        # push pr-<N>/ folder to gh-pages
  pull-requests: write   # comment preview URL on the PR
  actions: read          # download artifact from STAGE 1 run

concurrency:
  # NOTE: keyed on run id only. Indexing pull_requests[0] here misfires when
  # the array is empty (fork PRs) and can collapse unrelated runs together.
  group: preview-deploy-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish preview to gh-pages/pr-<N>/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOTE: no job-level `if:` on purpose. Gating lives in step 1 ("Resolve").
    # A job-level gate that filters everything out produces "No jobs were run",
    # which GitHub reports as a FAILED run and spams failure emails (e.g. every
    # time STAGE 1 is cancelled by a newer push, or a build fails). With the
    # gate in steps, these runs log a clear skip reason and stay green.

    steps:
      # ── 1. Gate + resolve PR number / author / head SHA (trusted API only) ──
      - name: 🔍 Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            // Gate: only successful builds from a pull_request event deploy.
            // Cancelled/superseded builds and failed builds land here on every
            // STAGE 1 completion — skipping quietly (no PR comment noise).
            if (run.conclusion !== 'success' || run.event !== 'pull_request') {
              core.info(`Skipping: conclusion=${run.conclusion} event=${run.event} (need success + pull_request).`);
              core.setOutput('skip', 'true');
              core.setOutput('skip_reason', `conclusion=${run.conclusion} event=${run.event}`);
              return;
            }
            let prs = run.pull_requests || [];
            let prNumber = prs.length > 0 ? prs[0].number : null;
            let headSha = run.head_sha;
            // Fallback: find PR by head SHA (fork PRs sometimes omit the array)
            if (!prNumber) {
              core.info(`No pull_requests in payload, searching by head SHA ${headSha}`);
              const { data } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              const match = data.find(p => p.head.sha === headSha);
              if (!match) {
                // NOT a failure. The usual cause is a PR that was closed or merged
                // after its STAGE 1 build finished: it is no longer in the open
                // set, so its head SHA cannot be resolved. setFailed() here marked
                // every close/merge of a PR with a red X on main, which is exactly
                // what this workflow's header says it exists to prevent. Nothing
                // is published on this path (every later step is gated on skip),
                // so skipping is the fail-safe direction. Warn rather than fail so
                // a genuinely broken lookup still shows up in the run summary
                // instead of the preview pipeline going quietly green.
                core.warning(`No open PR matches head SHA ${headSha} — the PR was most likely closed or merged while its build was running. Skipping preview deploy.`);
                core.setOutput('skip', 'true');
                core.setOutput('skip_reason', `unresolved-head-sha=${headSha}`);
                return;
              }
              prNumber = match.number;
            }
            if (!/^[0-9]+$/.test(String(prNumber))) {
              core.setFailed(`Refusing to deploy: PR number failed digit validation: ${prNumber}`);
              return;
            }
            // Fetch canonical PR metadata (author) from base context
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.info(`PR #${prNumber} by @${pr.user.login} state=${pr.state}`);
            if (pr.state === 'closed') {
              core.info('PR is already closed — skipping deploy (cleanup will handle it).');
              core.setOutput('skip', 'true');
              return;
            }
            core.setOutput('number', String(prNumber));
            core.setOutput('author', pr.user.login);
            core.setOutput('skip', 'false');

      # ── 2. Checkout TRUSTED base (main) — never the PR — for allow-list ─────
      - name: 📥 Checkout base (trusted, for writers allow-list + git ops)
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # persist-credentials TRUE (default) — needed to push to gh-pages.
          # Safe: ref is pinned to trusted `main`, never PR code.

      # ── 3. Authorization gate: only listed writers get a hosted preview ─────
      - name: '🔑 Authorization gate (fail-safe: no preview for strangers)'
        id: gate
        if: steps.pr.outputs.skip != 'true'
        env:
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          AUTHOR_LOWER=$(echo "${PR_AUTHOR}" | tr '[:upper:]' '[:lower:]')
          ALLOWED=$(grep -vE '^\s*#' blog-writers.txt | tr '[:upper:]' '[:lower:]' | tr -d ' \r\t' | grep -v '^$' || true)
          if echo "${ALLOWED}" | grep -qw "${AUTHOR_LOWER}"; then
            echo "✅ @${PR_AUTHOR} authorized — proceeding to deploy preview."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::@${PR_AUTHOR} not in blog-writers.txt — skipping preview deployment."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Download the UNTRUSTED build artifact (treated as opaque files) ──
      - name: 📥 Download preview artifact from STAGE 1
        if: steps.pr.outputs.skip != 'true' && steps.gate.outputs.allowed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: preview-pr-${{ steps.pr.outputs.number }}
          path: ./preview-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Publish ONLY pr-<N>/ to gh-pages (production root untouched) ─────
      - name: 🚀 Publish to gh-pages/pr-<N>/
        if: steps.pr.outputs.skip != 'true' && steps.gate.outputs.allowed == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Strict digit validation (defense in depth against path traversal)
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi
          PREVIEW_DIR="pr-${PR_NUMBER}"
          echo "Preview dir: ${PREVIEW_DIR}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages 2>/dev/null || echo "(no gh-pages branch yet — will create)"
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
            git pull --ff-only origin gh-pages || true
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            echo "# GitHub Pages (prod at root, PR previews under pr-<N>/)" > README.md
            git add README.md
            git commit -m "chore: init gh-pages branch"
            git push -u origin gh-pages
          fi

          # Replace ONLY this PR's folder; everything else (prod + other PRs) stays
          rm -rf "${PREVIEW_DIR}"
          mkdir -p "${PREVIEW_DIR}"
          cp -a preview-build/. "${PREVIEW_DIR}/"
          touch .nojekyll
          touch "${PREVIEW_DIR}/.nojekyll"

          git add "${PREVIEW_DIR}" .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "preview: update ${PREVIEW_DIR} (PR #${PR_NUMBER}, run ${{ github.event.workflow_run.id }})"
            git push origin gh-pages
            echo "✅ Pushed ${PREVIEW_DIR}/ to gh-pages."
          fi

      # ── 6. Comment (create/update) the preview URL on the PR ────────────────
      - name: 💬 Comment preview URL
        # Quiet skips (cancelled/failed builds) have no PR number AND skip=true:
        # never comment on those — just the green "skipped" log above.
        if: always() && steps.pr.outputs.number != '' && steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ALLOWED: ${{ steps.gate.outputs.allowed }}
          SKIPPED: ${{ steps.pr.outputs.skip }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            if (!prNumber || !/^[0-9]+$/.test(prNumber)) return;
            const skipped = process.env.SKIPPED === 'true';
            if (skipped) return;
            const allowed = process.env.ALLOWED === 'true';
            const deployFailed = '${{ job.status }}' !== 'success';
            let body;
            if (!allowed) {
              body = `## 👀 Blog Preview — not published\n\n` +
                `> @${context.payload.workflow_run?.head_repository?.owner?.login || 'author'} is not in \`blog-writers.txt\`, so no preview was deployed (spam protection).\n\n` +
                `An admin can add them to publish previews on future pushes.\n\n---\n_🤖 Preview bot · STAGE 2/2_`;
            } else if (deployFailed) {
              body = `## ⚠️ Blog Preview — build/deploy failed\n\nCheck the [failed run](${context.payload.workflow_run.html_url}) for logs (broken links, images, or MDX errors).\n\n---\n_🤖 Preview bot · STAGE 2/2_`;
            } else {
              const url = `https://${context.repo.owner}.github.io/blog/pr-${prNumber}/`;
              body = `## 👀 Blog Preview — ready!\n\n| | |\n|---|---|\n| 🔗 **Preview** | [${url}](${url}) |\n| 📂 Scope | \`gh-pages\` → \`pr-${prNumber}/\` (auto-deleted on close) |\n\n` +
                `> Push again to refresh. Check your post, images, dark/light mode, and mobile width.\n\n---\n_🤖 Preview bot · STAGE 2/2 · run ${context.payload.workflow_run.id}_`;
            }
            const marker = '<!-- haxnation-preview-bot -->';
            body += `\n${marker}`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(prNumber),
            });
            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(prNumber), body,
              });
            }
